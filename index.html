<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maré Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Topo / Busca -->
  <header class="p-4 bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80 shadow-md">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-3">
        <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">
          <i class="fa-solid fa-wave-square"></i> Maré Player
        </h1>
        <span class="text-xs px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full font-medium">YouTube Audio Engine</span>
      </div>
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Digite música ou artista (ex: Tool Pneuma, Metallica)..." 
               class="w-full bg-slate-800/90 border border-slate-700/80 rounded-full px-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-500 transition"
               onkeypress="if(event.key === 'Enter') buscarMusica()">
        <button onclick="buscarMusica()" id="searchBtn" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-semibold px-5 py-2 rounded-full text-sm transition shrink-0 flex items-center gap-1.5 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Buscar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Lista de Resultados -->
  <main class="p-4 flex-1 max-w-2xl mx-auto w-full pb-36">
    <div id="resultsList" class="space-y-2.5">
      <div class="text-center py-16 px-4">
        <div class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-800 text-amber-500 text-2xl">
          <i class="fa-solid fa-music"></i>
        </div>
        <p class="text-slate-300 font-medium text-base mb-1">Pronto para tocar</p>
        <p class="text-slate-500 text-sm max-w-xs mx-auto">Pesquise qualquer música para extrair o áudio direto do YouTube sem anúncios.</p>
      </div>
    </div>
  </main>

  <!-- Player Fixo -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 p-3 z-30 shadow-2xl">
    <div class="max-w-2xl mx-auto flex flex-col gap-2.5">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 overflow-hidden flex-1">
          <img id="playerCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=120&h=120&fit=crop" class="w-12 h-12 rounded-lg object-cover bg-slate-800 border border-slate-700/60 shrink-0">
          <div class="truncate">
            <p id="playerTitle" class="text-sm font-semibold text-slate-100 truncate">Nenhuma música tocando</p>
            <p id="playerArtist" class="text-xs text-slate-400 truncate">Selecione uma faixa acima</p>
          </div>
        </div>
        <div class="flex items-center gap-4 shrink-0">
          <button onclick="togglePlay()" id="playBtn" class="bg-amber-500 hover:bg-amber-400 active:scale-90 text-slate-950 w-11 h-11 rounded-full flex items-center justify-center text-lg font-bold shadow-lg shadow-amber-500/25 transition">
            <i class="fa-solid fa-play ml-0.5"></i>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-2.5 text-xs text-slate-400 font-mono">
        <span id="currentTime" class="w-8 text-right shrink-0">0:00</span>
        <input id="progressBar" type="range" min="0" max="100" value="0" class="w-full accent-amber-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        <span id="durationTime" class="w-8 shrink-0">0:00</span>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');

    const PIPED_INSTANCES = [
      'https://api.piped.privacydev.net',
      'https://pipedapi.kavin.rocks',
      'https://pipedapi.tokhmi.xyz',
      'https://pipedapi.moomoo.me'
    ];

    async function fetchPiped(endpoint) {
      for (let base of PIPED_INSTANCES) {
        try {
          const res = await fetch(`${base}${endpoint}`);
          if (res.ok) return await res.json();
        } catch (e) {}
      }
      return null;
    }

    async function buscarMusica() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = `
        <div class="text-center py-16">
          <i class="fa-solid fa-circle-notch fa-spin text-amber-500 text-3xl mb-3"></i>
          <p class="text-slate-300 font-medium">Buscando no YouTube...</p>
        </div>
      `;

      let data = await fetchPiped(`/search?q=${encodeURIComponent(query)}&filter=music_songs`);
      let items = data?.items || [];

      if (!items.length) {
        data = await fetchPiped(`/search?q=${encodeURIComponent(query)}&filter=all`);
        if (data?.items) {
          items = data.items.filter(i => i.type === 'video');
        }
      }

      if (!items.length) {
        resultsList.innerHTML = `
          <div class="text-center py-12 px-4 bg-slate-900/40 border border-slate-800 rounded-2xl">
            <i class="fa-solid fa-triangle-exclamation text-amber-500/80 text-3xl mb-2"></i>
            <p class="text-slate-200 font-medium">Nenhuma faixa encontrada</p>
            <p class="text-slate-400 text-xs mt-1">Tente pesquisar com outro nome.</p>
          </div>
        `;
        return;
      }

      window.currentSongs = items.map(item => {
        const videoId = item.url ? item.url.replace('/watch?v=', '') : '';
        return {
          id: videoId,
          title: item.title || 'Faixa sem título',
          artist: item.uploaderName || 'YouTube',
          cover: item.thumbnail || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&h=300&fit=crop'
        };
      }).filter(s => s.id);

      resultsList.innerHTML = window.currentSongs.map((song, index) => `
        <div onclick="tocar(${index})" 
             class="flex items-center gap-3 p-3 bg-slate-900/70 hover:bg-slate-800/90 active:bg-slate-800 rounded-xl cursor-pointer border border-slate-800/80 transition group">
          <img src="${song.cover}" class="w-12 h-12 rounded-lg object-cover bg-slate-800 border border-slate-700/60 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop'">
          <div class="flex-1 truncate">
            <p class="font-medium text-sm text-slate-100 group-hover:text-amber-400 transition truncate">${escapeHtml(song.title)}</p>
            <p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(song.artist)}</p>
          </div>
          <button class="text-amber-500 group-hover:scale-110 p-2 text-base shrink-0 transition">
            <i class="fa-solid fa-play"></i>
          </button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function tocar(index) {
      const song = window.currentSongs?.[index];
      if (!song) return;

      document.getElementById('playerTitle').innerText = song.title;
      document.getElementById('playerArtist').innerText = song.artist;
      document.getElementById('playerCover').src = song.cover;
      playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

      const streamData = await fetchPiped(`/streams/${song.id}`);
      const audioStreams = streamData?.audioStreams || [];

      if (!audioStreams.length) {
        alert('Não foi possível carregar o áudio desta faixa. Tente outra!');
        playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
        return;
      }

      const bestAudio = audioStreams.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];

      audio.src = bestAudio.url;
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause ml-0.5"></i>';
      }).catch(err => {
        playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
      });
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<i class="fa-solid fa-pause ml-0.5"></i>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
      }
    }

    audio.ontimeupdate = () => {
      if (!audio.duration || isNaN(audio.duration)) return;
      progressBar.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.innerText = formatTime(audio.currentTime);
      durationTimeEl.innerText = formatTime(audio.duration);
    };

    progressBar.oninput = () => {
      if (!audio.duration || isNaN(audio.duration)) return;
      audio.currentTime = (progressBar.value / 100) * audio.duration;
    };

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
  </script>
</body>
</html>
